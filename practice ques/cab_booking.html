<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Cab Booking System</title>
</head>
<body>
  <script>
    class Vehicle {
      static platformName = "QuickRide";

      constructor(vehicleNo, driverName, distance) {
        this.vehicleNo = vehicleNo;
        this.driverName = driverName;
        this.distance = distance;
      }

      calculateFare() {
        return 0; 
      }

      static displayPlatformName() {
        console.log(`Welcome to ${Vehicle.platformName}`);
      }
    }

    class Car extends Vehicle {
      constructor(vehicleNo, driverName, distance) {
        super(vehicleNo, driverName, distance);
      }

      calculateFare() {
        return this.distance * 15; 
      }

    }

    class Bike extends Vehicle {
      constructor(vehicleNo, driverName, distance) {
        super(vehicleNo, driverName, distance);
      }

      calculateFare() {
        return this.distance * 8; 
      }
    }

    Vehicle.displayPlatformName();

    const car1 = new Car("UP-01-1234", "Shivam", 10);
    const bike1 = new Bike("UP-02-5678", "Shivani", 10);
    console.log(`Car fare for 10 km: Rs. ${car1.calculateFare()}`);
    console.log(`Bike fare for 10 km: Rs. ${bike1.calculateFare()}`);


  </script>
</body>
</html>
