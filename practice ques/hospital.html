<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System</title>
</head>
<body>
  <script>
    class Person {
      static personCount = 0;

      constructor(id, name, age) {
        this.id = id;
        this.name = name;
        this.age = age;
        Person.personCount++;
      }

      displayDetails() {
        console.log(`ID: ${this.id}, Name: ${this.name}, Age: ${this.age}`);
      }

      static displayPersonCount() {
        console.log(`Total Persons: ${Person.personCount}`);
      }
    }

    class Doctor extends Person {
      constructor(id, name, age, specialization, consultationFee) {
        super(id, name, age);
        this.specialization = specialization;
        this.consultationFee = consultationFee;
      }

      displayDetails() {
        super.displayDetails();
        console.log(`Specialization: ${this.specialization}, Consultation Fee: $${this.consultationFee}`);
      }
    }

    class Patient extends Person {
      constructor(id, name, age, disease, roomNo) {
        super(id, name, age);
        this.disease = disease;
        this.roomNo = roomNo;
      }

      displayDetails() {
        super.displayDetails();
        console.log(`Disease: ${this.disease}, Room Number: ${this.roomNo}`);
      }
    }

    const doctor1 = new Doctor(1, "Dr. Smriti", 45, "Cardiology", 200);
    const doctor2 = new Doctor(2, "Dr. jenny", 50, "Neurology", 250);
    const patient1 = new Patient(1, "ravi", 30, "Flu", 101);
    const patient2 = new Patient(2, "savi", 25, "Broken Arm", 102);

    doctor1.displayDetails();
    doctor2.displayDetails();
    patient1.displayDetails();
    patient2.displayDetails();

    Person.displayPersonCount();
  </script>
</body>
</html>
