<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern</title>
</head>
  <script>
    function P()
    {
      let num=parseInt(prompt("Enter the number of rows: "));
      for(let i=1;i<=num;i++)
      {
        for(let j=1;j<=i;j++)
        {
          document.write("*");
        }
        document.write("<br>");
      }
    }
  </script>
<body>
  <input type="button" value="Pattern" onclick="P()">
</body>
</html>
