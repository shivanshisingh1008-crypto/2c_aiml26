//upper functions are normal function. now the following funcyions are arrow function (they will reduce the line of code)

sum=() =>
{
  let a=10;
  let b=20;
  c=a+b;
  return c;
}

console.log(sum())


//display= name => console.log(name);

fullname=(first , last) => {
  
  return `${first} ${last}`;
}
let first="vikas"
  let last="chodhary"
console.log(fullname(first, last))
