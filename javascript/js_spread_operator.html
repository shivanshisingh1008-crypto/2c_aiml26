<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spread operator</title>
</head>
<body>
  <script>
    let data=[10,20,30,40]
    function Sum(...args){
      let Sum=0;
      for(let i of args){
        Sum =Sum +i;
      }
      console.log(Sum);
    }
    Sum(10,20,30);
    Sum(...data);
    console.log(data);
    console.log(...data)
    console.log([...data])
  </script>
</body>
</html>
